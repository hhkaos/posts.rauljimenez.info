name: Refresh webmentions snapshot

# The "Responses from around the web" sections (and the timeline reaction
# counts) are baked into the static HTML at build time from
# scripts/webmentions-snapshot.json, so a page view costs webmention.io
# nothing and the section survives their intermittent 502s. This job keeps
# that file current: one authenticated domain-wide query a day instead of
# one fetch per visitor per page.
#
# Committing the refreshed snapshot to main triggers a real rebuild via
# posts-build's repository webhook (this host, see
# /home/home-server/workspace/posts-build/README.md) — a plain repo
# webhook fires on any push regardless of which token authored it, unlike
# Actions' own `on: push` anti-recursion guard (which is why this used to
# need an explicit "Trigger a rebuild" `gh workflow run publish.yml` step;
# publish.yml is workflow_dispatch-only now, so that step was removed).
#
# This job itself is now a redundant daily safety net for the real-time
# path (webmention-notify -> posts-build POST /refresh-snapshot on every
# new mention) — cheap since it only commits when mentions actually
# changed. repository_dispatch is a manual escape hatch to force a refresh
# without waiting for the schedule.

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Refetch everything instead of only what is new
        type: boolean
        default: false
  repository_dispatch:
    types: [webmention]

permissions:
  contents: write

concurrency:
  group: webmentions-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Fetch mentions
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        run: |
          npx webmentions-snapshot \
            --domain posts.rauljimenez.info \
            --out scripts/webmentions-snapshot.json \
            ${{ inputs.full && '--full' || '' }}

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- scripts/webmentions-snapshot.json; then
            echo "No change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/webmentions-snapshot.json
          git commit -m "chore: refresh webmentions snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

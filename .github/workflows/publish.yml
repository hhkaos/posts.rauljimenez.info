name: Publish posts and send webmentions

# Manual fallback only. The normal build+deploy path is now
# posts-build (this host, webhook-triggered on every push to main) —
# see /home/home-server/workspace/posts-build/README.md. Kept here as a
# break-glass: if the host's build breaks but the repo already has good
# content, `gh workflow run publish.yml` redeploys from GitHub's own infra
# without depending on this host at all.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/render.mjs
        env:
          # Geocodes address-only locations (events) for the map. Absent →
          # those posts just aren't mapped. `.geocode-cache.json` is
          # git-ignored (forStorage=false — results aren't persisted across
          # builds), so each build re-geocodes the handful of addresses.
          ARCGIS_CLIENT_ID: ${{ secrets.ARCGIS_CLIENT_ID }}
          ARCGIS_CLIENT_SECRET: ${{ secrets.ARCGIS_CLIENT_SECRET }}
      - name: Verify author microformats2 (representative + nested h-card)
        run: node scripts/verify-mf2.mjs
      - name: Screenshot post pages for social cards / syndication media
        run: |
          npx playwright install --with-deps chromium
          node scripts/screenshot.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  webmentions:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/send-webmentions.mjs
      - run: |
          git config user.name "indiekit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .webmentions-sent.json
          git diff --cached --quiet || git commit -m "Record sent webmentions [skip ci]"
          git push

name: Publish posts and send webmentions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/render.mjs
      - name: Verify author microformats2 (representative + nested h-card)
        run: node scripts/verify-mf2.mjs
      - name: Screenshot post pages for social cards / syndication media
        run: |
          npx playwright install --with-deps chromium
          node scripts/screenshot.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  webmentions:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/send-webmentions.mjs
      - run: |
          git config user.name "indiekit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .webmentions-sent.json
          git diff --cached --quiet || git commit -m "Record sent webmentions [skip ci]"
          git push
